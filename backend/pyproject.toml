[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observer-lite"
version = "0.2.2"
description = "A lightweight open-source ping, HTTP, and SSL monitor."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.10.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.31",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "aiosmtplib>=5.1.2",
    "cryptography>=50.0.0",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1.0",
    "anyio>=4.14.2",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint]
per-file-ignores = { "app/db/models/*.py" = ["F821"] }

[tool.ruff.lint.flake8-bugbear]
# FastAPI evaluates Depends/Query/Security once and treats them as markers.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]
